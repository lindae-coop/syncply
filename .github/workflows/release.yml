# Publica unha versión ao subir unha etiqueta vX.Y.Z:
#  - imaxe ghcr.io/<propietario>/syncply-pairsrv:vX.Y.Z, cos paquetes do
#    cliente dentro (deploy/Containerfile.pairsrv): o servidor sérveos aos
#    usuarios, que non dependen de GitHub para descargalos;
#  - versión de GitHub cos mesmos paquetes, como copia.
#
# Os paquetes van cun manifesto asinado (update.json + .sig) para que os
# clientes se actualicen desde o seu servidor: a clave privada está no
# segredo SYNCPLY_UPDATE_KEY do repositorio (ver internal/update/keys.go).
#
#   git tag v0.1.0 && git push origin v0.1.0
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # crear a versión
  packages: write  # subir a imaxe

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/syncply-pairsrv
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: |
          docker run --rm -v "$PWD:/src" -w /src docker.io/library/golang:1.27.4-alpine \
            sh -c 'CGO_ENABLED=0 go vet ./... && CGO_ENABLED=0 go test ./...'

      - name: Imaxe
        env:
          SYNCPLY_UPDATE_KEY: ${{ secrets.SYNCPLY_UPDATE_KEY }}
        run: |
          test -n "$SYNCPLY_UPDATE_KEY" || { echo "falta o segredo SYNCPLY_UPDATE_KEY"; exit 1; }
          docker build -f deploy/Containerfile.pairsrv --build-arg VERSION="$VERSION" \
            --secret id=update_key,env=SYNCPLY_UPDATE_KEY -t "$IMAGE:$VERSION" .

      - name: Subir a imaxe
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$VERSION"

      - name: Versión de GitHub cos paquetes do cliente
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(docker create "$IMAGE:$VERSION")
          docker cp "$id:/descargas" descargas
          docker rm "$id"
          test -s descargas/update.json -a -s descargas/update.json.sig || { echo "a imaxe non leva o manifesto asinado"; exit 1; }
          (cd descargas && sha256sum * > SHA256SUMS)
          gh release create "$VERSION" descargas/* --title "$VERSION" --generate-notes \
            --notes "Imaxe do servidor: \`$IMAGE:$VERSION\`"
