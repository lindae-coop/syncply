# Contorno de desenvolvemento do prototipo (Podman rootless).
# As APIs só son accesibles desde a rede interna "stnet". A única excepción
# é a web dos clientes cld, publicada só en 127.0.0.1 do equipo (como no
# cliente real) para abrila co navegador: make ui C=1.
name: cld

x-syncthing: &syncthing
  image: docker.io/syncthing/syncthing:2.1.7
  environment:
    # En Podman rootless, o root do contedor é o teu usuario no host:
    # os ficheiros de ./.dev quedan ao teu nome.
    PUID: "0"
    PGID: "0"
    STGUIADDRESS: "0.0.0.0:8384"
    STGUIAPIKEY: ${ST_APIKEY:-cld-dev-apikey-NON-USAR-EN-PRODUCION}
    STNOUPGRADE: "1"
    STNODEFAULTFOLDER: "1"
  networks: [stnet]
  restart: unless-stopped

x-sftpgo-env: &sftpgo-env
  SFTPGO_ADMIN_USER: admin
  SFTPGO_ADMIN_PASSWORD: ${SFTPGO_ADMIN_PASSWORD:-cld-dev-admin-NON-USAR-EN-PRODUCION}

x-go: &go
  image: docker.io/library/golang:1.27.4-alpine
  working_dir: /src
  environment:
    <<: *sftpgo-env
    PAIRSRV_HOOK_TOKEN: ${PAIRSRV_HOOK_TOKEN:-cld-dev-hook-NON-USAR-EN-PRODUCION}
    ST_APIKEY: ${ST_APIKEY:-cld-dev-apikey-NON-USAR-EN-PRODUCION}
    CGO_ENABLED: "0"
    GOFLAGS: "-buildvcs=false"
  networks: [stnet]

x-cld: &cld
  <<: *go
  restart: unless-stopped

services:
  # SFTPGo con BD SQLite. Os datos dos usuarios (/srv/sftpgo/data) móntanse
  # na mesma ruta en st-server, para que as rutas de SFTPGo valan tal cal.
  sftpgo:
    image: docker.io/drakkan/sftpgo:v2.7.6-alpine
    hostname: sftpgo
    user: "0:0"
    environment:
      SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN: "true"
      SFTPGO_DEFAULT_ADMIN_USERNAME: admin
      SFTPGO_DEFAULT_ADMIN_PASSWORD: ${SFTPGO_ADMIN_PASSWORD:-cld-dev-admin-NON-USAR-EN-PRODUCION}
    volumes:
      - ./.dev/sftpgo/lib:/var/lib/sftpgo:z
      - ./.dev/sftpgo/data:/srv/sftpgo/data:z
    networks: [stnet]
    restart: unless-stopped

  st-server:
    <<: *syncthing
    hostname: st-server
    volumes:
      - ./.dev/st-server:/var/syncthing:Z
      - ./.dev/sftpgo/data:/srv/sftpgo/data:z

  # Clientes de proba (no demo: client1 e client3 son de alice, client2 de bob).
  st-client1:
    <<: *syncthing
    hostname: st-client1
    volumes:
      - ./.dev/st-client1:/var/syncthing:Z

  st-client2:
    <<: *syncthing
    hostname: st-client2
    volumes:
      - ./.dev/st-client2:/var/syncthing:Z

  st-client3:
    <<: *syncthing
    hostname: st-client3
    volumes:
      - ./.dev/st-client3:/var/syncthing:Z

  # Servizo de emparellamento: le usuarios e TOTP da BD de SFTPGo (só
  # lectura) e configura st-server. :8080 é a API dos clientes; :8081, a
  # interna para os avisos do xestor de eventos de SFTPGo. A reconciliación
  # periódica vai a 5 min para que a demo comprobe que os avisos funcionan.
  pairsrv:
    <<: *go
    hostname: pairsrv
    command: ["go", "run", "./cmd/pairsrv",
              "-config", "dev/pairsrv.json",
              "-state", "/state/state.json",
              "-listen", ":8080",
              "-hook-listen", ":8081",
              "-reconcile", "5m"]
    volumes:
      - ./:/src:z
      - ./.dev/pairsrv:/state:Z
      - ./.dev/sftpgo/lib:/sftpgo:ro,z
      - gocache:/root/.cache/go-build
      - gomod:/go/pkg/mod
    restart: unless-stopped

  # Clientes de escritorio (web de configuración) de cada nodo cliente.
  cld-client1:
    <<: *cld
    hostname: cld-client1
    command: ["go", "run", "./cmd/cld", "daemon", "-dir", "/cfg", "-config", "dev/cld.json",
              "-listen", "0.0.0.0:8400", "-public-url", "http://127.0.0.1:8411",
              "-st-url", "http://st-client1:8384", "-folders-base", "/var/syncthing/data"]
    ports: ["127.0.0.1:8411:8400"]
    volumes:
      - ./:/src:z
      - ./.dev/cld-client1:/cfg:Z
      - gocache:/root/.cache/go-build
      - gomod:/go/pkg/mod

  cld-client2:
    <<: *cld
    hostname: cld-client2
    command: ["go", "run", "./cmd/cld", "daemon", "-dir", "/cfg", "-config", "dev/cld.json",
              "-listen", "0.0.0.0:8400", "-public-url", "http://127.0.0.1:8412",
              "-st-url", "http://st-client2:8384", "-folders-base", "/var/syncthing/data"]
    ports: ["127.0.0.1:8412:8400"]
    volumes:
      - ./:/src:z
      - ./.dev/cld-client2:/cfg:Z
      - gocache:/root/.cache/go-build
      - gomod:/go/pkg/mod

  cld-client3:
    <<: *cld
    hostname: cld-client3
    command: ["go", "run", "./cmd/cld", "daemon", "-dir", "/cfg", "-config", "dev/cld.json",
              "-listen", "0.0.0.0:8400", "-public-url", "http://127.0.0.1:8413",
              "-st-url", "http://st-client3:8384", "-folders-base", "/var/syncthing/data"]
    ports: ["127.0.0.1:8413:8400"]
    volumes:
      - ./:/src:z
      - ./.dev/cld-client3:/cfg:Z
      - gocache:/root/.cache/go-build
      - gomod:/go/pkg/mod

  # Ferramentas en Go (sen instalar Go no host). Uso: make proto ARGS="..."
  tools:
    <<: *go
    volumes:
      - ./:/src:z
      - ./.dev:/nodes:z
      - gocache:/root/.cache/go-build
      - gomod:/go/pkg/mod

networks:
  stnet: {}

volumes:
  gocache: {}
  gomod: {}
