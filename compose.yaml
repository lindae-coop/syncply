# Contorno de desenvolvemento do prototipo (Podman rootless).
# As APIs só son accesibles desde a rede interna "stnet". As excepcións,
# publicadas só en 127.0.0.1 do equipo para abrilas co navegador, son a web
# dos clientes cld (make ui C=1) e a web de pairsrv onde os usuarios ven o
# código de vinculación (make web, http://127.0.0.1:8090).
name: cld

x-syncthing: &syncthing
  image: docker.io/syncthing/syncthing:2.1.7
  environment:
    # En Podman rootless, o root do contedor é o teu usuario no host:
    # os ficheiros de ./.dev quedan ao teu nome.
    PUID: "0"
    PGID: "0"
    STGUIADDRESS: "0.0.0.0:8384"
    STGUIAPIKEY: ${ST_APIKEY:-cld-dev-apikey-NON-USAR-EN-PRODUCION}
    STNOUPGRADE: "1"
    STNODEFAULTFOLDER: "1"
  networks: [stnet]
  restart: unless-stopped

x-sftpgo-env: &sftpgo-env
  SFTPGO_ADMIN_USER: admin
  SFTPGO_ADMIN_PASSWORD: ${SFTPGO_ADMIN_PASSWORD:-cld-dev-admin-NON-USAR-EN-PRODUCION}

x-go: &go
  image: docker.io/library/golang:1.27.4-alpine
  working_dir: /src
  environment:
    <<: *sftpgo-env
    PAIRSRV_HOOK_TOKEN: ${PAIRSRV_HOOK_TOKEN:-cld-dev-hook-NON-USAR-EN-PRODUCION}
    ST_APIKEY: ${ST_APIKEY:-cld-dev-apikey-NON-USAR-EN-PRODUCION}
    # Desenvolvemento: pairsrv e cld permiten http (en produción, só https
    # detrás dun proxy) e as cookies de pairsrv van sen Secure.
    CLD_DEV: "1"
    CGO_ENABLED: "0"
    GOFLAGS: "-buildvcs=false"
  networks: [stnet]

# Clientes: cada contedor executa `cld daemon`, que arranca o seu propio
# Syncthing (como no equipo dun usuario). Hostname st-clientN para que stproto
# chegue á API de Syncthing (en desenvolvemento en TCP interno con
# ST_APIKEY; no cliente real vai nun socket Unix). A web publícase só en
# 127.0.0.1. Reutiliza ./.dev/st-clientN/config como directorio de Syncthing
# (mesma identidade que cando eran contedores de Syncthing).
x-client: &client
  <<: *go
  image: localhost/cld-client-dev:latest
  build:
    context: dev
    dockerfile: Containerfile.client
  restart: unless-stopped

services:
  # SFTPGo con BD SQLite. Os datos dos usuarios (/srv/sftpgo/data) móntanse
  # na mesma ruta en st-server, para que as rutas de SFTPGo valan tal cal.
  sftpgo:
    image: docker.io/drakkan/sftpgo:v2.7.6-alpine
    hostname: sftpgo
    user: "0:0"
    environment:
      SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN: "true"
      SFTPGO_DEFAULT_ADMIN_USERNAME: admin
      SFTPGO_DEFAULT_ADMIN_PASSWORD: ${SFTPGO_ADMIN_PASSWORD:-cld-dev-admin-NON-USAR-EN-PRODUCION}
    volumes:
      - ./.dev/sftpgo/lib:/var/lib/sftpgo:z
      - ./.dev/sftpgo/data:/srv/sftpgo/data:z
    networks: [stnet]
    restart: unless-stopped

  st-server:
    <<: *syncthing
    hostname: st-server
    volumes:
      - ./.dev/st-server:/var/syncthing:Z
      - ./.dev/sftpgo/data:/srv/sftpgo/data:z

  # No demo: client1 e client3 son de alice, client2 de bob.
  st-client1:
    <<: *client
    hostname: st-client1
    command: ["go", "run", "./cmd/cld", "daemon", "-dir", "/cfg",
              "-listen", "0.0.0.0:8400", "-public-url", "http://127.0.0.1:8411",
              "-st-home", "/var/syncthing/config", "-st-gui", "0.0.0.0:8384",
              "-folders-base", "/var/syncthing/data"]
    ports: ["127.0.0.1:8411:8400"]
    volumes:
      - ./:/src:z
      - ./.dev/st-client1:/var/syncthing:Z
      - ./.dev/cld-client1:/cfg:Z
      - gocache:/root/.cache/go-build
      - gomod:/go/pkg/mod

  st-client2:
    <<: *client
    hostname: st-client2
    command: ["go", "run", "./cmd/cld", "daemon", "-dir", "/cfg",
              "-listen", "0.0.0.0:8400", "-public-url", "http://127.0.0.1:8412",
              "-st-home", "/var/syncthing/config", "-st-gui", "0.0.0.0:8384",
              "-folders-base", "/var/syncthing/data"]
    ports: ["127.0.0.1:8412:8400"]
    volumes:
      - ./:/src:z
      - ./.dev/st-client2:/var/syncthing:Z
      - ./.dev/cld-client2:/cfg:Z
      - gocache:/root/.cache/go-build
      - gomod:/go/pkg/mod

  st-client3:
    <<: *client
    hostname: st-client3
    command: ["go", "run", "./cmd/cld", "daemon", "-dir", "/cfg",
              "-listen", "0.0.0.0:8400", "-public-url", "http://127.0.0.1:8413",
              "-st-home", "/var/syncthing/config", "-st-gui", "0.0.0.0:8384",
              "-folders-base", "/var/syncthing/data"]
    ports: ["127.0.0.1:8413:8400"]
    volumes:
      - ./:/src:z
      - ./.dev/st-client3:/var/syncthing:Z
      - ./.dev/cld-client3:/cfg:Z
      - gocache:/root/.cache/go-build
      - gomod:/go/pkg/mod

  # Servizo de emparellamento: le usuarios e permisos da BD de SFTPGo (só
  # lectura), comproba os contrasinais coa API de SFTPGo e configura
  # st-server. web.publicURL (dev/pairsrv.json) é http://pairsrv:8080, a URL
  # coa que chegan os clientes desde a rede do contorno, aínda que a web se
  # abra en 127.0.0.1:8090. :8080 é a web dos usuarios (código de vinculación e descarga
  # dos paquetes de ./dist) e a API dos clientes; :8081, a interna para os
  # avisos do xestor de eventos de SFTPGo. A reconciliación
  # periódica vai a 5 min para que a demo comprobe que os avisos funcionan.
  pairsrv:
    <<: *go
    hostname: pairsrv
    command: ["go", "run", "./cmd/pairsrv",
              "-config", "dev/pairsrv.json",
              "-state", "/state/state.json",
              "-listen", ":8080",
              "-hook-listen", ":8081",
              "-downloads", "/dist",
              "-reconcile", "5m"]
    ports: ["127.0.0.1:8090:8080"]
    volumes:
      - ./:/src:z
      - ./dist:/dist:ro,z
      - ./.dev/pairsrv:/state:Z
      - ./.dev/sftpgo/lib:/sftpgo:ro,z
      - gocache:/root/.cache/go-build
      - gomod:/go/pkg/mod
    restart: unless-stopped

  # Ferramentas en Go (sen instalar Go no host). Uso: make proto ARGS="..."
  tools:
    <<: *go
    volumes:
      - ./:/src:z
      - ./.dev:/nodes:z
      - gocache:/root/.cache/go-build
      - gomod:/go/pkg/mod

networks:
  stnet: {}

volumes:
  gocache: {}
  gomod: {}
